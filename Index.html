<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sell Everything</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:     #1a1714;
      --paper:   #f7f4ef;
      --warm:    #e8e2d8;
      --accent:  #c4602a;
      --muted:   #8a8278;
      --card-bg: #ffffff;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      padding: 3rem 2rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      border-bottom: 1px solid var(--warm);
    }

    .brand {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .brand span {
      color: var(--accent);
    }

    .tagline {
      font-size: 0.85rem;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding-bottom: 0.3rem;
    }

    /* ── Header right area ── */
    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1rem;
      padding-bottom: 0.3rem;
    }

    /* ── Enter Product button ── */
    .btn-enter-product {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--card-bg);
      background: var(--accent);
      border: 1.5px solid var(--accent);
      padding: 0.55rem 1.1rem;
      border-radius: 2px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: background 0.15s, color 0.15s, opacity 0.15s;
    }

    .btn-enter-product:hover {
      opacity: 0.85;
    }

    /* ── Grid ── */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem 2rem 4rem;
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.5rem;
    }

    /* ── Card ── */
    .card {
      background: var(--card-bg);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(26,23,20,0.1);
    }

    .card-img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: var(--warm);
      display: block;
    }

    .card-body {
      padding: 1.1rem 1.2rem 1.3rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .card-category {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .card-name {
      font-family: 'DM Serif Display', serif;
      font-size: 1.15rem;
      line-height: 1.25;
    }

    .card-footer {
      margin-top: auto;
      padding-top: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .price {
      font-size: 1rem;
      font-weight: 500;
      color: var(--ink);
    }

    .price-old {
      font-size: 0.8rem;
      font-weight: 300;
      color: var(--muted);
      text-decoration: line-through;
      margin-left: 0.4rem;
    }

    .btn-add {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1.5px solid var(--accent);
      background: transparent;
      padding: 0.45rem 0.85rem;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .btn-add:hover {
      background: var(--accent);
      color: white;
    }

    /* Badge */
    .badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.2rem 0.5rem;
      border-radius: 2px;
      margin-left: 0.4rem;
      vertical-align: middle;
    }

    .badge-sale { background: #fde8dc; color: var(--accent); }
    .badge-new  { background: #ddeee8; color: #2a7a5a; }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.78rem;
      color: var(--muted);
      border-top: 1px solid var(--warm);
    }

    @media (max-width: 500px) {
      header { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
      .header-right { align-items: flex-start; }
    }
  </style>
</head>
<body>

<header>
  <div>
    <div class="brand">The <span>Curated</span> Shop</div>
  </div>
  <div class="header-right">
    <a href="add-product.html" class="btn-enter-product">+ Enter Product</a>
    <div class="tagline">Thoughtfully made goods</div>
  </div>
</header>

<main>
  <p class="section-label">All Products — 9 items</p>
  <div class="grid" id="product-grid"></div>
</main>

<footer>© 2026 The Curated Shop · All rights reserved</footer>

<script>
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ-9GF3XVOFXQTsMNly-3Md7ENohEjNSITePU0pxwYrWJM3Xp43uXiZcbrxlZWi0Cs_Ye7KxQzbb_mU/pub?output=csv';

  function parseCSV(text) {
    const [headerLine, ...rows] = text.trim().split('\n');
    const headers = headerLine.split(',').map(h => h.trim());
    return rows.map((row, i) => {
      // Handle commas inside quoted fields
      const cols = [];
      let cur = '', inQuote = false;
      for (const ch of row) {
        if (ch === '"') { inQuote = !inQuote; }
        else if (ch === ',' && !inQuote) { cols.push(cur.trim()); cur = ''; }
        else { cur += ch; }
      }
      cols.push(cur.trim());
      const obj = { id: i + 1 };
      headers.forEach((h, idx) => obj[h] = cols[idx] ?? '');
      obj.price    = parseFloat(obj.price) || 0;
      obj.oldPrice = obj.oldPrice && obj.oldPrice !== 'null' ? parseFloat(obj.oldPrice) : null;
      obj.badge    = obj.badge === 'null' || !obj.badge ? null : obj.badge;
      return obj;
    });
  }

  function renderProducts(products) {
    const grid = document.getElementById('product-grid');
    document.querySelector('.section-label').textContent =
      `All Products — ${products.length} item${products.length !== 1 ? 's' : ''}`;

    products.forEach(p => {
      const badgeHTML = p.badge
        ? `<span class="badge badge-${p.badge}">${p.badge}</span>`
        : '';
      const oldPriceHTML = p.oldPrice
        ? `<span class="price-old">$${p.oldPrice}</span>`
        : '';

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img class="card-img" src="${p.img}" alt="${p.name}" loading="lazy" />
        <div class="card-body">
          <div class="card-category">${p.category}${badgeHTML}</div>
          <div class="card-name">${p.name}</div>
          <div class="card-footer">
            <div><span class="price">$${p.price}</span>${oldPriceHTML}</div>
            <button class="btn-add" onclick="addToCart(${p.id}, this)">Add</button>
          </div>
        </div>`;
      grid.appendChild(card);
    });
  }

  async function loadProducts() {
    const grid = document.getElementById('product-grid');
    try {
      const res = await fetch(CSV_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      const products = parseCSV(text);
      renderProducts(products);
    } catch (err) {
      grid.innerHTML = `<p style="color:var(--muted);grid-column:1/-1">
        Failed to load products. Please check the sheet is published and try again.
      </p>`;
      console.error('Failed to load products:', err);
    }
  }

  function addToCart(id, btn) {
    btn.textContent = '✓ Added';
    btn.style.background = 'var(--accent)';
    btn.style.color = 'white';
    setTimeout(() => {
      btn.textContent = 'Add';
      btn.style.background = '';
      btn.style.color = '';
    }, 1500);
  }

  loadProducts();
</script>

</body>
</html>
